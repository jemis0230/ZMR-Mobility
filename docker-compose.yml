version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Bound to localhost only — the database must not be reachable from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      APP_BASE_URL: https://${DOMAIN}
      CRON_SECRET: ${CRON_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LEAD_EMAIL_FROM: ${LEAD_EMAIL_FROM:-}
      LEAD_NOTIFY_EMAIL_TO: ${LEAD_NOTIFY_EMAIL_TO:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_LEAD_RECIPIENTS: ${WHATSAPP_LEAD_RECIPIENTS:-}
      WHATSAPP_LEAD_TEMPLATE: ${WHATSAPP_LEAD_TEMPLATE:-}
      WHATSAPP_LEAD_TEMPLATE_LANGUAGE: ${WHATSAPP_LEAD_TEMPLATE_LANGUAGE:-en}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v21.0}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    volumes:
      - uploads:/app/public/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/srv/uploads:ro
    depends_on:
      - app

  # Sends queued/retrying lead notifications every 5 minutes (new leads are also
  # sent immediately by the app). Uses the same CRON_SECRET as the app; it is written
  # into the crontab at start because crond does not pass environment variables to jobs.
  notifier:
    image: alpine:3.20
    restart: unless-stopped
    init: true
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: >
      /bin/sh -c "
        echo \"*/5 * * * * wget -q -O /dev/null --header='Authorization: Bearer $$CRON_SECRET' http://app:3000/api/cron/notifications\" | crontab - &&
        crond -f -l 2"

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    cap_add:
      - SYS_PTRACE
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache dcron &&
        echo '0 2 * * * /bin/sh /backup.sh' | crontab - &&
        crond -f -l 2"

volumes:
  postgres_data:
  backup_data:
  uploads:
  caddy_data:
  caddy_config:
